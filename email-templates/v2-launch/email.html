<!DOCTYPE html>

<head>

  <!--[if mso]>

    <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>

  <style>
    body { margin: 0; padding: 0; background-color: #0F0F0F; }
    img { border: 0; display: block; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a { text-decoration: none; }
    table { border-collapse: collapse; }
    .mobile-only { display: none; max-height: 0; overflow: hidden; }

<body style="margin:0;padding:0;background-color:#0F0F0F;">

  <!-- Preheader -->

          <!-- MAIN VISUAL PNG — desktop (560px) -->

                  alt="We rebuilt Helthy. Here's what's new. v2 is live on iOS and Android. AI got smarter, deeper insights, faster logging, Android is here, Premium at $2.99/mo."

                  style="display:block;width:100%;max-width:560px;height:auto;border:0;" />

            </td>
          </tr>
          <!-- MAIN VISUAL PNG — mobile (375px) -->

              <a href="https://apps.apple.com/us/app/helthy-track-food-workouts/id6751759974" style="display:block;text-decoration:none;">
                <img src="img/full-email-mobile.png"
                  alt="We rebuilt Helthy. Here's what's new. v2 is live on iOS and Android. AI got smarter, deeper insights, faster logging, Android is here, Premium at $2.99/mo."

                  style="display:block;width:100%;max-width:375px;height:auto;border:0;" />

            </td>
          </tr>

          <!-- SIG + FOOTER — desktop (560px) -->
          <tr class="desktop-only">
            <td style="padding:0;font-size:0;line-height:0;">

                style="display:block;width:100%;max-width:560px;height:auto;border:0;" />
            </td>
          </tr>
          <!-- SIG + FOOTER — mobile (375px) -->
          <tr class="mobile-only">
            <td style="padding:0;font-size:0;line-height:0;">
              <img src="img/sig-footer-mobile.png"
                alt="Already have it? Update the app to get v2. – Chibu &amp; Ebuka. P.S. Reply directly with feedback — we read every message."
                width="375" height="280"
                style="display:block;width:100%;max-width:375px;height:auto;border:0;" />

          <tr>
            <td style="padding:0;font-size:0;line-height:0;text-align:center;">
              <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="margin:0 auto;">
                <tr>
                  <td style="padding-right:12px;vertical-align:middle;">
                    <a href="https://apps.apple.com/us/app/helthy-track-food-workouts/id6751759974" style="display:block;text-decoration:none;">
                      <img src="img/btn-appstore.png" alt="Download on the App Store" width="141" height="45"

                  <td style="vertical-align:middle;">
