<!DOCTYPE html>
<!--
  SHIPPED email — references PNGs generated from source.html via
  scripts/render_email_images.py. After running the script, update the
  width/height attributes below with the values it prints.

  Golden rule: image-based sections preserve your design verbatim in Gmail.
  Text-based sections (signature, footer) use the system-font stack because
  they don't carry brand typography — no point sending them as images.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <title>Email subject line</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <style>
    body { margin: 0; padding: 0; background-color: #0F0F0F; }
    img { border: 0; display: block; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a { text-decoration: none; }
    table { border-collapse: collapse; }
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; }
      .img-full { width: 100% !important; height: auto !important; }
    }
    /* ── Gmail dark-mode guard ────────────────────────────────────────────
       Gmail adds [data-ogsc] to <html> when it forces dark mode and inverts
       near-black backgrounds (#151515 → white). These rules restore original
       colors after Gmail's pass. Always pair with bgcolor="" attributes on
       the same <table>/<td> elements (see below) for clients that ignore
       <style> blocks entirely.
       See EMAIL_GUIDE.md → "Dark mode (Gmail Android)" for full explanation.
    */
    [data-ogsc] body        { background-color: #0F0F0F !important; }
    [data-ogsc] .outer-wrap { background-color: #141A1E !important; }
    [data-ogsc] .inner-card { background-color: #151515 !important; }
    [data-ogsc] .body-pad   { background-color: #151515 !important; }
    [data-ogsc] .footer-bg  { background-color: #111111 !important; }
    [data-ogsc] .sig-text   { color: #9A9A9A !important; }
    [data-ogsc] .sig-ps     { color: #777777 !important; }
    [data-ogsc] .footer-text{ color: #666666 !important; }
    [data-ogsc] a.footer-link { color: #666666 !important; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#0F0F0F;">

  <!-- Preheader: shows after subject in inbox list -->
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    One-line preview that appears next to the subject in the inbox.&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation"
    class="outer-wrap" bgcolor="#141A1E"
    style="background:linear-gradient(180deg,#0F0F0F 0%,#1A2024 35%,#1F282E 65%,#0F0F0F 100%);background-color:#141A1E;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- inner-card + bgcolor: required for Gmail dark-mode guard — see EMAIL_GUIDE.md -->
        <table class="container inner-card" width="560" cellpadding="0" cellspacing="0" border="0" role="presentation" bgcolor="#151515" style="max-width:560px;width:100%;background-color:#151515;border-radius:20px;overflow:hidden;">

          <!-- HERO — width/height updated by render script output -->
          <tr>
            <td style="padding:0;">
              <img class="img-full" src="img/hero.png" alt="Replace with descriptive alt text" width="528" height="306" style="display:block;width:100%;max-width:528px;height:auto;border:0;" />
            </td>
          </tr>

          <!-- Feature cards — add/remove rows to match your [data-email-crop] entries -->
          <tr>
            <td class="body-pad" bgcolor="#151515" style="background-color:#151515;padding:14px 40px 14px;">
              <img class="img-full" src="img/card-1.png" alt="Feature one description" width="478" height="200" style="display:block;width:100%;max-width:478px;height:auto;border:0;" />
            </td>
          </tr>
          <tr>
            <td class="body-pad" bgcolor="#151515" style="background-color:#151515;padding:0 40px 14px;">
              <img class="img-full" src="img/card-2.png" alt="Feature two description" width="478" height="200" style="display:block;width:100%;max-width:478px;height:auto;border:0;" />
            </td>
          </tr>

          <!-- Premium card (clickable) -->
          <tr>
            <td class="body-pad" bgcolor="#151515" style="background-color:#151515;padding:4px 40px 24px;">
              <a href="https://apps.apple.com/us/app/helthy-track-food-workouts/id6751759974" style="display:block;text-decoration:none;">
                <img class="img-full" src="img/premium.png" alt="Premium plan details — tap to subscribe" width="478" height="290" style="display:block;width:100%;max-width:478px;height:auto;border:0;" />
              </a>
            </td>
          </tr>

          <!-- Store buttons (each clickable) -->
          <tr>
            <td class="body-pad" bgcolor="#151515" style="background-color:#151515;padding:0 40px 36px;">
              <table cellpadding="0" cellspacing="0" border="0" role="presentation">
                <tr>
                  <td style="padding-right:12px;vertical-align:middle;">
                    <a href="https://apps.apple.com/us/app/helthy-track-food-workouts/id6751759974" style="display:block;">
                      <img src="img/btn-appstore.png" alt="Download on the App Store" width="151" height="49" style="display:block;width:151px;height:49px;border:0;" />
                    </a>
                  </td>
                  <td style="vertical-align:middle;">
                    <a href="https://play.google.com/store/apps/details?id=com.helthy.app" style="display:block;">
                      <img src="img/btn-googleplay.png" alt="Get it on Google Play" width="163" height="50" style="display:block;width:163px;height:50px;border:0;" />
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td bgcolor="#151515" style="background-color:#151515;padding:0 40px;">
              <div style="height:1px;background-color:#262626;line-height:1px;font-size:0;">&nbsp;</div>
            </td>
          </tr>

          <!-- Signature (system fonts — not brand-critical) -->
          <tr>
            <td class="body-pad" bgcolor="#151515" style="background-color:#151515;padding:24px 40px 28px;">
              <p class="sig-text" style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.6;color:#9A9A9A;">
                – Chibu &amp; Ebuka<br />
                <span class="sig-ps" style="font-size:13px;color:#777777;">P.S. Reply directly with feedback — we read every message.</span>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="footer-pad footer-bg" bgcolor="#111111" style="background-color:#111111;padding:20px 40px 40px;text-align:center;border-top:1px solid #1F1F1F;">
              <p class="footer-text" style="margin:0 0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;color:#666666;line-height:1.5;">
                You're receiving this because you signed up for Helthy updates.<br />
                Helthy App &middot; 115th Street, Cleveland, Ohio
              </p>
              <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;">
                <a href="{{unsubscribeUrl}}" class="footer-link" style="color:#666666;text-decoration:underline;">Unsubscribe</a>
                &nbsp;&middot;&nbsp;
                <a href="https://helthy.app/privacy" class="footer-link" style="color:#666666;text-decoration:underline;">Privacy Policy</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
